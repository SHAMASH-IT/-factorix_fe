name: Build & Deploy Factorix UI

on:
  push:
    tags:
      - 'NPE_UI_PROD*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/factorixui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/factorixui:${{ github.ref_name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOSTNAME_NPE }}
          username: ${{ secrets.SERVER_USERNAME_NPE }}
          port: 22
          key: ${{ secrets.SERVER_PASSWORD_NPE }}
          script: |
            echo "Deploying tag: ${{ github.ref_name }}"
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/factorixui:${{ github.ref_name }}

            docker stop factorixui || true
            docker rm factorixui || true

            docker run -d \
              --name factorixui \
              --network factorix-net \
              -p 3000:4173 \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/factorixui:${{ github.ref_name }}

            docker image prune -f
